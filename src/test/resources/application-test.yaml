spring:
  cloud:
    config:
      enabled: false
  datasource:
    url: jdbc:h2:mem:interview-service;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: create-drop
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://issuer.test/realms/micro-service
          jwk-set-uri: http://issuer.test/realms/micro-service/protocol/openid-connect/certs

eureka:
  client:
    enabled: false
