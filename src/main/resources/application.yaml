spring:
  application:
    name: interview-service
  datasource:
    url: ${INTERVIEW_DB_URL:jdbc:postgresql://localhost:5432/interview_db}
    username: ${INTERVIEW_DB_USERNAME}
    password: ${INTERVIEW_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  cloud:
    openfeign:
      circuitbreaker:
        enabled: true

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${KEYCLOAK_SERVER_URL:http://localhost:8080}/realms/${KEYCLOAK_REALM:micro-service}/protocol/openid-connect/certs
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080}/realms/${KEYCLOAK_REALM:micro-service}


server:
  port: 8098


eureka:
  client:
    service-url:
      defaultZone: ${DISCOVERY_SERVICE_URL:http://localhost:8761/eureka}

    register-with-eureka: true
    fetch-registry: true

  instance:
    prefer-ip-address: true
logging:
  level:
    org.hibernate.SQL: warn
    org.hibernate.orm.jdbc.bind: warn
    org.springframework.security: warn
    org.springframework.web: warn

---
spring:
  config:
    activate:
      on-profile: "!test"
    import: optional:configserver:${CONFIG_SERVICE_URL:http://localhost:9999}
  cloud:
    config:
      enabled: true
      label: main
